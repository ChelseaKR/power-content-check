name: Release

# Two jobs with different authority.
#
# The first job can read but not write. It checks out trusted main, confirms
# the requested ref really is an annotated, signed tag object, and confirms
# that tag points at a commit already on main.
#
# The first job also re-runs the same `make verify` gate CI runs, at the exact
# commit the tag names, and refuses a tag whose name disagrees with the package
# version, so nothing unverified can be published under a verified-looking tag.
#
# The second job can write but never checks out a working tree, so nothing in
# the repository at the tagged ref can influence what it does. It re-resolves
# the tag through the API before publishing, so a tag moved between the two
# jobs does not slip through.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify the signed tag against trusted main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to run from anywhere but main
        run: |
          echo "dispatched from ${GITHUB_REF}"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Confirm the ref is an annotated tag object
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "${TAG}")" = "tag"

      - name: Refuse a signer list that names no principal
        run: |
          # Present is not the same as populated. A file of comments would let
          # verify-tag run against an empty principal list, and the failure
          # would read like a bad signature rather than a missing key.
          grep -qv '^[[:space:]]*\(#\|$\)' .github/allowed_signers

      - name: Verify the tag signature
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git verify-tag "${TAG}"

      - name: Confirm the tag is an ancestor of main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Run the full gate at the tagged commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git checkout --detach "${TAG}^{commit}"
          make verify

      - name: Confirm the tag and the package version agree
        env:
          TAG: ${{ inputs.tag }}
        run: |
          want="${TAG#v}"
          have="$(uv run python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "${want}" = "${have}"

  publish:
    name: Publish the release
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # `/git/ref/tags/<tag>` on an ANNOTATED tag returns the tag *object*, not the
      # commit, so `.object.sha` here is a tag SHA. `gh release create --target`
      # wants a commitish, and handing it a tag object made the API answer
      # `HTTP 500`: measured on the first ever run of this workflow, 2026-09-07,
      # for v0.1.0: it passed 03241d92 (the tag object) where a258c77 (the commit)
      # was needed, and a 500 tells the reader nothing about which of the two it is.
      #
      # This could never have worked. `verify-tag` above *requires* an annotated tag
      # (`git cat-file -t "${TAG}"` must be `tag`), so every tag this workflow
      # accepts resolves to a tag object here, and the two jobs contradicted each
      # other. It survived because the workflow is `workflow_dispatch`-only and had
      # never been dispatched: an unexercised release path is unguarded code.
      #
      # So: read the ref once, keep the type as well as the SHA, and dereference.
      # One read, because re-reading would reopen the window this job's whole
      # design is about: a tag moved between the two jobs must not slip through.
      - name: Re-resolve the tag through the API and dereference it to a commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          object_type="$(printf '%s' "${ref}" | jq -r '.object.type')"
          object_sha="$(printf '%s' "${ref}" | jq -r '.object.sha')"
          # Refused rather than dereferenced-if-possible: verify-tag checked the
          # signature on an annotated tag object, so publishing a lightweight tag
          # here would publish something nothing verified.
          test "${object_type}" = "tag"
          commit_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
          test -n "${commit_sha}"
          echo "TAG_SHA=${commit_sha}" >> "${GITHUB_ENV}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TAG_SHA}" \
            --title "${TAG}" \
            --notes "See CHANGELOG.md for the entry covering ${TAG}."
